<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verstecken!" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Verstecken!</title>
    <style>
      :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        background: linear-gradient(180deg, #eef2ff 0%, #ffffff 45%, #eef2ff 100%);
        color: #1e293b;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      button { touch-action: manipulation; }
      .wrap { max-width: 620px; margin: 0 auto; padding: 14px 14px 40px; }
      h1 { font-size: 26px; margin: 0; }
      .sub { color: #64748b; margin: 4px 0 0; font-size: 15px; }
      .stats { color: #64748b; font-size: 14px; margin-top: 4px; }

      .install {
        margin: 12px 0; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 14px;
        padding: 12px 14px; font-size: 14px; line-height: 1.6; position: relative;
      }
      .install b { color: #3730a3; }
      .install .close {
        position: absolute; top: 8px; right: 10px; border: none; background: none;
        font-size: 18px; color: #6366f1; cursor: pointer; padding: 4px 8px;
      }

      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
      .btn {
        border: none; cursor: pointer; border-radius: 14px; padding: 12px 16px;
        font-size: 15px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15);
        background: #fff; color: #475569; min-height: 44px;
      }
      .btn:active { transform: scale(.96); }
      .btn.primary { background: #4f46e5; color: #fff; }
      .btn.green { background: #059669; color: #fff; }
      .btn.sel { background: #4f46e5; color: #fff; }

      .card {
        background: #fff; border-radius: 18px; padding: 16px;
        box-shadow: 0 1px 5px rgba(15,23,42,.08); border: 1px solid #e2e8f0; margin-bottom: 16px;
      }
      .card h2 { font-size: 18px; margin: 0 0 10px; }
      .chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
      .chip { border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
      .chip.r0 { background: #bae6fd; color: #075985; }
      .chip.r1 { background: #a7f3d0; color: #065f46; }
      .chip.r2 { background: #fde68a; color: #92400e; }
      .boardwrap { display: flex; justify-content: center; }
      .board { display: grid; grid-template-columns: repeat(5, 62px); gap: 5px; padding: 7px; background: #e2e8f0; border-radius: 14px; }
      @media (max-width: 400px) { .board { grid-template-columns: repeat(5, 56px); } .board .cell { width: 56px; height: 56px; } }
      .cell {
        width: 62px; height: 62px; border-radius: 10px; position: relative;
        display: flex; align-items: center; justify-content: center;
      }
      .cell.r0 { background: #e0f2fe; }
      .cell.r1 { background: #d1fae5; }
      .cell.r2 { background: #fef3c7; }
      .cell.hit { outline: 2.5px solid #6366f1; }
      .pin {
        position: absolute; top: -9px; left: -7px; background: #fff;
        border: 1px solid #a5b4fc; border-radius: 999px; padding: 1px 6px; font-size: 16px;
      }
      .legend { margin-top: 12px; font-size: 13px; color: #64748b; line-height: 1.7; text-align: center; }
      .rules { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.65; margin-top: 12px; }
      .rules ul { margin: 0; padding-left: 20px; }
      .rules li { margin: 4px 0; }

      /* ---------- Hinweiskarten im Bild-Stil ---------- */
      .cluegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .cluecard {
        background: #fff; border: 1.5px solid #111; border-radius: 12px;
        padding: 10px 8px; text-align: center;
      }
      .cluecard .ctop { display: flex; flex-direction: column; align-items: center; }
      .cluecard .cemoji { font-size: 34px; line-height: 1.25; margin-top: 2px; }
      .cluecard .cname { font-weight: 600; font-size: 15px; margin-top: 2px; }
      .cluecard .ctext { font-size: 13px; color: #334155; margin-top: 5px; line-height: 1.5; }

      .tip { background: #fffbeb; border: 1px solid #fde68a; border-radius: 14px; padding: 11px 13px; font-size: 14px; margin-top: 12px; }
      .pads { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
      .pad { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 10px; text-align: center; }
      .pad .pname { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
      .pad .pname small { font-weight: 400; color: #94a3b8; }
      .pgrid { display: grid; grid-template-columns: repeat(5, 32px); gap: 3px; justify-content: center; }
      .pbtn { width: 32px; height: 32px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; background: #fff; }
      .pbtn.r0 { background: #f0f9ff; }
      .pbtn.r1 { background: #ecfdf5; }
      .pbtn.r2 { background: #fffbeb; }
      .pbtn.no { color: #f43f5e; }
      .pbtn.yes { color: #059669; }
      .note { font-size: 13px; color: #94a3b8; margin-top: 4px; }
      .kids { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
      .kids .btn { font-size: 16px; }
      .feedback { margin-top: 14px; border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.65; }
      .feedback.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
      .feedback.bad { background: #fff1f2; color: #9f1239; border: 1px solid #fecdd3; }
      footer { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 20px; line-height: 1.7; }

      /* ---------- Druckansicht ---------- */
      #printsheet { display: none; padding: 12px; }
      body.printmode #app { display: none; }
      body.printmode #printsheet { display: block; }
      .printbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; max-width: 840px; margin: 0 auto 12px; }
      .sheet {
        background: #fff; max-width: 840px; margin: 0 auto 24px; padding: 26px;
        box-shadow: 0 2px 10px rgba(0,0,0,.18); border-radius: 4px; color: #111;
      }
      .sheet h1 { font-size: 22px; }
      .sheet h2 { font-size: 14px; margin: 14px 0 6px; }
      .psub { color: #444; font-size: 13px; line-height: 1.5; }
      .pcols { display: flex; gap: 24px; margin-top: 10px; }
      .pcols > div { flex: 1; }
      .prules { font-size: 12.5px; padding-left: 16px; line-height: 1.55; margin: 0; }
      .prooms { font-size: 12.5px; padding-left: 16px; margin: 6px 0 0; line-height: 1.5; }
      .prooms .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
      .ptable { border-collapse: collapse; margin-top: 2px; }
      .ptable td {
        width: 72px; height: 52px; text-align: center; vertical-align: middle; position: relative;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      .ptable td.r0 { background: #e0f2fe; }
      .ptable td.r1 { background: #d1fae5; }
      .ptable td.r2 { background: #fef3c7; }
      td.pnum { border: none !important; width: 18px; font-size: 10px; color: #555; height: auto; background: #fff !important; }
      .prl { position: absolute; top: 1px; left: 3px; font-size: 8px; color: #666; }
      .pperson { font-weight: 700; font-size: 12px; }
      .pcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .pcard {
        border: 1.5px solid #111; border-radius: 10px; padding: 7px 6px; text-align: center;
        page-break-inside: avoid; break-inside: avoid;
      }
      .pcard .cemoji { font-size: 24px; line-height: 1.25; }
      .pcard .cname { font-weight: 600; font-size: 12px; margin-top: 2px; }
      .pcard .ctext { font-size: 10.5px; color: #334155; margin-top: 4px; line-height: 1.45; }
      .panswer { border: 2px solid #111; padding: 10px 12px; font-size: 13px; margin-top: 18px; font-weight: 600; }
      .psol { border: 2px solid #111; padding: 10px 12px; font-size: 13px; margin-top: 12px; line-height: 1.5; }
      .ppos { font-size: 12.5px; line-height: 1.6; padding-left: 16px; margin: 0; }
      .phint { font-size: 11px; color: #666; margin-top: 10px; }
      #printhint {
        display: none; margin-top: 8px; background: #fef3c7; border: 1px solid #f59e0b;
        border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #78350f;
      }

      @media print {
        #app { display: none !important; }
        #printsheet { display: block !important; padding: 0; }
        .noprint { display: none !important; }
        body { background: #fff; }
        .sheet { box-shadow: none; margin: 0; padding: 0; max-width: none; border-radius: 0; }
        .sheet:not(:last-of-type) { break-after: page; }
        @page { size: A4; margin: 10mm; }
      }
    </style>
  </head>
  <body>
    <main id="app" class="wrap"></main>
    <section id="printsheet"></section>

    <script>
      // ============================================================
      // Verstecken! – App-Ausgabe für iPhone (läuft offline, ohne Netz).
      // ============================================================

      const KIDS = ["Mila", "Ben", "Sofia", "Tim"];
      const SEEKER = "Luis";
      const EMOJI = ["🦊", "🐻", "🐰", "🐨", "🦉"];
      const ROOMS = ["Spielzimmer", "Wohnzimmer", "Küche"];
      const ROOM_COLOR = ["#e0f2fe", "#d1fae5", "#fef3c7"];
      const IN_ROOM = ["im Spielzimmer", "im Wohnzimmer", "in der Küche"];
      const ITEM_NAME = { chair: "Stuhl", sofa: "Sofa", table: "Tisch", shelf: "Regal" };
      const N = 5;
      const SEEKER_IDX = 4;

      // ---------------- Gegenstände: Bilder ----------------
      // Tisch und Regal sind eigene Outline-Zeichnungen (kein Baumstumpf,
      // kein Bücherstapel); Stuhl und Sofa bleiben als Piktogramm.
      const ITEM_SVG = {
        table:
          '<svg viewBox="0 0 48 48" width="100%" height="100%">' +
          '<g fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round">' +
          '<path d="M6 16 H42"/><path d="M11 16 V36"/><path d="M37 16 V36"/><path d="M14 24 H34"/>' +
          "</g></svg>",
        shelf:
          '<svg viewBox="0 0 48 48" width="100%" height="100%">' +
          '<g fill="none" stroke="#111" stroke-width="2.3">' +
          '<rect x="7" y="9" width="34" height="30"/>' +
          '<path d="M7 24 H41"/>' +
          "</g>" +
          '<g fill="none" stroke="#111" stroke-width="1.5">' +
          '<rect x="12" y="13.5" width="4" height="10.5"/><rect x="18" y="16" width="4" height="8"/>' +
          '<rect x="12" y="27.5" width="3" height="11.5"/><rect x="17" y="30" width="4" height="9"/>' +
          '<rect x="23.5" y="27" width="4" height="12"/><rect x="29" y="29" width="3.5" height="10"/>' +
          '<rect x="24" y="13.5" width="3.5" height="10.5"/>' +
          "</g></svg>"
      };

      function itemHTML(kind, px) {
        if (kind === "table" || kind === "shelf") {
          return '<div style="width:' + px + "px;height:" + px + 'px">' + ITEM_SVG[kind] + "</div>";
        }
        const e = kind === "chair" ? "🪑" : "🛋️";
        return '<span style="font-size:' + Math.round(px * 0.85) + 'px">' + e + "</span>";
      }

      function nameOf(i) { return i === SEEKER_IDX ? SEEKER : KIDS[i]; }

      function clueText(cl) {
        switch (cl.k) {
          case "roomIn": return nameOf(cl.p) + " ist " + IN_ROOM[cl.room] + ".";
          case "roomOut": return nameOf(cl.p) + " ist nicht " + IN_ROOM[cl.room] + ".";
          case "chair": return nameOf(cl.p) + " sitzt auf einem Stuhl.";
          case "sofa": return nameOf(cl.p) + " sitzt auf dem Sofa.";
          case "nextTable": return nameOf(cl.p) + " ist neben dem Tisch.";
          case "nextShelf": return nameOf(cl.p) + " ist neben dem Regal.";
          case "sameRoomTable": return nameOf(cl.p) + " ist im selben Raum wie der Tisch.";
          case "notRoomTable": return nameOf(cl.p) + " ist nicht im selben Raum wie der Tisch.";
          case "sameRoomShelf": return nameOf(cl.p) + " ist im selben Raum wie das Regal.";
          case "notRoomShelf": return nameOf(cl.p) + " ist nicht im selben Raum wie das Regal.";
          case "nextTo": return nameOf(cl.a) + " ist neben " + nameOf(cl.b) + ".";
          case "corner": return nameOf(cl.p) + " ist in einer Ecke des Grundrisses.";
          case "col": return nameOf(cl.p) + " ist in der " + (cl.c + 1) + ". Spalte von links.";
          case "row": return nameOf(cl.p) + " ist in der " + (cl.r + 1) + ". Reihe von oben.";
          case "leftOf": return nameOf(cl.a) + " ist weiter links als " + nameOf(cl.b) + ".";
          case "below": return nameOf(cl.a) + " ist weiter unten als " + nameOf(cl.b) + ".";
        }
      }

      // ---------------- Zufall (mulberry32) ----------------
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function permutations(n) {
        const res = [];
        const arr = Array.from({ length: n }, (_, i) => i);
        const c = new Array(n).fill(0);
        res.push(arr.slice());
        let i = 0;
        while (i < n) {
          if (c[i] < i) {
            if (i % 2 === 0) { [arr[0], arr[i]] = [arr[i], arr[0]]; }
            else { [arr[c[i]], arr[i]] = [arr[i], arr[c[i]]]; }
            res.push(arr.slice());
            c[i]++; i = 0;
          } else { c[i] = 0; i++; }
        }
        return res;
      }

      // ---------------- Generator ----------------
      function attempt(seed) {
        const rnd = mulberry32(seed);
        const int = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
        const pickT = (arr) => arr[Math.floor(rnd() * arr.length)];
        const shuffleT = (arr) => {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(rnd() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        };

        const rowPerms = permutations(N);
        const colPerms = permutations(N);

        const h = int(2, 3);
        const roomFlat = new Uint8Array(N * N);
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            roomFlat[r * N + c] = c < 2 ? 0 : (r < h ? 1 : 2);
          }
        }

        const chosen = shuffleT(Array.from({ length: N * N }, (_, x) => x)).slice(0, 5);
        const chairs = new Uint8Array(N * N);
        chairs[chosen[0]] = 1; chairs[chosen[1]] = 1;
        const sofaCell = chosen[2], tableCell = chosen[3], shelfCell = chosen[4];
        const isBlock = new Uint8Array(N * N);
        isBlock[tableCell] = 1; isBlock[shelfCell] = 1;

        const adj = (x, y) => {
          const dr = Math.floor(x / N) - Math.floor(y / N);
          const dc = (x % N) - (y % N);
          return dr * dr + dc * dc === 1;
        };

        const all = [];
        for (const rp of rowPerms) {
          for (const cp of colPerms) {
            let ok = true;
            for (let i = 0; i < N; i++) if (isBlock[rp[i] * N + cp[i]]) { ok = false; break; }
            if (!ok) continue;
            const vr = roomFlat[rp[SEEKER_IDX] * N + cp[SEEKER_IDX]];
            let cnt = 0;
            for (let i = 0; i < SEEKER_IDX; i++) if (roomFlat[rp[i] * N + cp[i]] === vr) cnt++;
            if (cnt !== 1) continue;
            all.push([rp[0], rp[1], rp[2], rp[3], rp[4], cp[0], cp[1], cp[2], cp[3], cp[4]]);
          }
        }
        if (all.length < 300) return null;

        const planted = pickT(all);
        const cellOf = (s, i) => s[i] * N + s[N + i];
        const roomOfP = (s, i) => roomFlat[cellOf(s, i)];

        const cand = [];
        for (let i = 0; i < SEEKER_IDX; i++) {
          const cell = cellOf(planted, i), room = roomOfP(planted, i);
          cand.push({ k: "roomIn", p: i, room: room });
          for (const x of [0, 1, 2]) if (x !== room) cand.push({ k: "roomOut", p: i, room: x });
          if (chairs[cell]) cand.push({ k: "chair", p: i });
          if (cell === sofaCell) cand.push({ k: "sofa", p: i });
          if (adj(cell, tableCell) && roomFlat[cell] === roomFlat[tableCell]) cand.push({ k: "nextTable", p: i });
          if (adj(cell, shelfCell) && roomFlat[cell] === roomFlat[shelfCell]) cand.push({ k: "nextShelf", p: i });
          cand.push(room === roomFlat[tableCell] ? { k: "sameRoomTable", p: i } : { k: "notRoomTable", p: i });
          cand.push(room === roomFlat[shelfCell] ? { k: "sameRoomShelf", p: i } : { k: "notRoomShelf", p: i });
          const r = Math.floor(cell / N), c = cell % N;
          if ((r === 0 || r === N - 1) && (c === 0 || c === N - 1)) cand.push({ k: "corner", p: i });
          cand.push({ k: "col", p: i, c: c });
          cand.push({ k: "row", p: i, r: r });
          for (let j = 0; j < N; j++) {
            if (j === i) continue;
            const cj = cellOf(planted, j);
            if (adj(cell, cj) && roomFlat[cell] === roomFlat[cj]) cand.push({ k: "nextTo", a: i, b: j });
          }
        }
        // Auch wo Luis selbst sucht, ist ein Hinweis.
        const luisRoom = roomOfP(planted, SEEKER_IDX);
        cand.push({ k: "roomIn", p: SEEKER_IDX, room: luisRoom });
        for (const x of [0, 1, 2]) if (x !== luisRoom) cand.push({ k: "roomOut", p: SEEKER_IDX, room: x });
        for (let t = 0; t < 4; t++) {
          const a = int(0, SEEKER_IDX - 1), b = int(0, SEEKER_IDX - 1);
          if (a === b) continue;
          cand.push(planted[N + a] < planted[N + b] ? { k: "leftOf", a: a, b: b } : { k: "leftOf", a: b, b: a });
          cand.push(planted[a] > planted[b] ? { k: "below", a: a, b: b } : { k: "below", a: b, b: a });
        }

        const holds = (cl, s) => {
          switch (cl.k) {
            case "roomIn": return roomOfP(s, cl.p) === cl.room;
            case "roomOut": return roomOfP(s, cl.p) !== cl.room;
            case "chair": return chairs[cellOf(s, cl.p)] === 1;
            case "sofa": return cellOf(s, cl.p) === sofaCell;
            case "nextTable": { const c0 = cellOf(s, cl.p); return adj(c0, tableCell) && roomFlat[c0] === roomFlat[tableCell]; }
            case "nextShelf": { const c0 = cellOf(s, cl.p); return adj(c0, shelfCell) && roomFlat[c0] === roomFlat[shelfCell]; }
            case "sameRoomTable": return roomOfP(s, cl.p) === roomFlat[tableCell];
            case "notRoomTable": return roomOfP(s, cl.p) !== roomFlat[tableCell];
            case "sameRoomShelf": return roomOfP(s, cl.p) === roomFlat[shelfCell];
            case "notRoomShelf": return roomOfP(s, cl.p) !== roomFlat[shelfCell];
            case "nextTo": { const ca = cellOf(s, cl.a), cb = cellOf(s, cl.b); return adj(ca, cb) && roomFlat[ca] === roomFlat[cb]; }
            case "corner": {
              const r = s[cl.p], c = s[N + cl.p];
              return (r === 0 || r === N - 1) && (c === 0 || c === N - 1);
            }
            case "col": return s[N + cl.p] === cl.c;
            case "row": return s[cl.p] === cl.r;
            case "leftOf": return s[N + cl.a] < s[N + cl.b];
            case "below": return s[cl.a] > s[cl.b];
          }
        };

        let cur = all;
        const used = [];
        const path = [];
        const remaining = shuffleT(cand);
        // Hinweise mit Bezug auf Räume und Gegenstände haben Vorrang:
        // Sie werden genommen, solange sie die Möglichkeiten spürbar
        // eingrenzen (auf höchstens 75 %). Reihe/Spalte/Vergleiche helfen
        // nur aus, wenn sie deutlich mehr ausschließen.
        const isRoomItem = (cl) =>
          cl.k === "roomIn" || cl.k === "roomOut" || cl.k === "chair" ||
          cl.k === "sofa" || cl.k === "nextTable" || cl.k === "nextShelf" ||
          cl.k === "sameRoomTable" || cl.k === "notRoomTable" ||
          cl.k === "sameRoomShelf" || cl.k === "notRoomShelf" || cl.k === "nextTo";
        while (cur.length > 1 && remaining.length > 0) {
          let bestRI = null, bestRIArr = null, bestAb = null, bestAbArr = null;
          for (const cl of remaining) {
            const f = cur.filter((s) => holds(cl, s));
            if (f.length === 0 || f.length >= cur.length) continue;
            if (isRoomItem(cl)) {
              if (!bestRIArr || f.length < bestRIArr.length) { bestRI = cl; bestRIArr = f; }
            } else if (!bestAbArr || f.length < bestAbArr.length) { bestAb = cl; bestAbArr = f; }
          }
          let best = null, bestArr = null;
          if (bestRIArr && (bestRIArr.length <= Math.ceil(cur.length * 0.75) ||
              !bestAbArr || bestRIArr.length <= bestAbArr.length * 2.5)) {
            best = bestRI; bestArr = bestRIArr;
          } else { best = bestAb; bestArr = bestAbArr; }
          if (!best || !bestArr) break;
          path.push(bestArr.length);
          used.push(best);
          remaining.splice(remaining.indexOf(best), 1);
          cur = bestArr;
        }
        if (cur.length !== 1) return null;
        const sol = cur[0];
        for (let i = 0; i < 2 * N; i++) if (sol[i] !== planted[i]) return null;

        const vr = roomOfP(sol, SEEKER_IDX);
        const foundFirst = [0, 1, 2, 3].find((i) => roomOfP(sol, i) === vr);
        if (foundFirst === undefined) return null;

        // Hinweiskarten: Text + Emoji der Person, um die es geht
        const clueCards = shuffleT(used.map((cl) => ({
          t: clueText(cl),
          p: cl.p !== undefined ? cl.p : cl.a
        })));

        return {
          rooms: Array.from(roomFlat),
          items: [
            { kind: "chair", cell: chosen[0] },
            { kind: "chair", cell: chosen[1] },
            { kind: "sofa", cell: sofaCell },
            { kind: "table", cell: tableCell },
            { kind: "shelf", cell: shelfCell },
          ],
          clueCards: clueCards,
          positions: Array.from({ length: N }, (_, i) => sol[i] * N + sol[N + i]),
          foundFirst: foundFirst,
          baseCount: all.length,
          path: path,
        };
      }

      function generatePuzzle(baseSeed) {
        for (let s = 0; s < 400; s++) {
          const p = attempt((baseSeed + s * 7919) % 2147483000);
          if (p) return p;
        }
        for (let s = 0; s < 400; s++) {
          const p = attempt((baseSeed - s * 104729 + 2147483000) % 2147483000);
          if (p) return p;
        }
        throw new Error("Konnte kein Rätsel erzeugen.");
      }

      // ---------------- Zustand ----------------
      let seed = Math.floor(Math.random() * 2147483000) + 1;
      let puzzle = generatePuzzle(seed);
      let marks = Array.from({ length: N }, () => new Array(N * N).fill(0));
      let answer = null;
      let revealed = false;
      let feedback = null;
      let printMode = false;

      let solvedCount = 0;
      try { solvedCount = parseInt(localStorage.getItem("vssolved") || "0", 10) || 0; } catch (e) {}

      const isStandalone =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;

      const app = document.getElementById("app");
      const sheetEl = document.getElementById("printsheet");

      function caseNo() { return String(seed % 100000).padStart(5, "0"); }
      function itemAt(x) { return puzzle.items.find((it) => it.cell === x) || null; }
      function personAt(x) { const i = puzzle.positions.indexOf(x); return i >= 0 ? i : null; }
      function posLine(p) {
        const x = puzzle.positions[p];
        return "Reihe " + (Math.floor(x / N) + 1) + ", Spalte " + ((x % N) + 1) + " (" + ROOMS[puzzle.rooms[x]] + ")";
      }

      function clueCardHTML(c, p, print) {
        const cls = print ? "pcard" : "cluecard";
        return '<div class="' + cls + '">'
          + '<div class="ctop"><div class="cemoji">' + EMOJI[p] + "</div></div>"
          + '<div class="cname">' + nameOf(p) + "</div>"
          + '<div class="ctext">' + c + "</div>"
          + "</div>";
      }

      function renderApp() {
        let boardCells = "";
        for (let x = 0; x < N * N; x++) {
          const room = puzzle.rooms[x];
          const it = itemAt(x);
          const p = revealed ? personAt(x) : null;
          boardCells += '<div class="cell r' + room + (p !== null ? " hit" : "") + '">'
            + (it ? itemHTML(it.kind, 28) : "")
            + (p !== null ? '<span class="pin">' + EMOJI[p] + "</span>" : "")
            + "</div>";
        }

        let clueCards = clueCardHTML(
          "Luis zählt bis hundert und sucht dann. Er war allein mit genau einem Kind im Raum – dieses Kind findet er als Erstes.",
          SEEKER_IDX, false
        );
        puzzle.clueCards.forEach((c) => { clueCards += clueCardHTML(c.t, c.p, false); });

        let pads = "";
        for (let p = 0; p < N; p++) {
          let cells = "";
          for (let x = 0; x < N * N; x++) {
            const m = marks[p][x];
            const room = puzzle.rooms[x];
            cells += '<button class="pbtn r' + room + (m === 1 ? " no" : m === 2 ? " yes" : "") + '" data-act="pad" data-p="' + p + '" data-x="' + x + '">'
              + (m === 1 ? "❌" : m === 2 ? "✅" : "·") + "</button>";
          }
          pads += '<div class="pad"><div class="pname">' + EMOJI[p] + " " + nameOf(p)
            + (p === SEEKER_IDX ? " <small>(sucht)</small>" : "") + '</div><div class="pgrid">' + cells + "</div></div>";
        }

        let kidsBtn = "";
        KIDS.forEach((k, i) => {
          kidsBtn += '<button class="btn' + (answer === i ? " sel" : "") + '" data-act="kid" data-k="' + i + '">' + EMOJI[i] + " " + k + "</button>";
        });

        app.innerHTML =
          "<h1>🙈 Verstecken!</h1>"
          + '<p class="sub">Luis sucht – wer wird als Erstes gefunden?</p>'
          + '<p class="stats">✅ Gelöste Fälle: ' + solvedCount + "</p>"
          + (!isStandalone
            ? '<div class="install"><button class="close" data-act="hideInstall">✕</button>'
            + "<b>Wie eine echte App nutzen:</b> In Safari unten auf „Teilen“ (das Quadrat mit dem Pfeil nach oben) tippen "
            + "und dann „Zum Home-Bildschirm“ wählen. Danach startet Verstecken! vom Home-Bildschirm "
            + "im Vollbild – ohne Adressleiste, ganz offline.</div>"
            : "")
          + '<div class="toolbar">'
          + '<button class="btn primary" data-act="new">🔄 Neuer Fall</button>'
          + '<button class="btn" data-act="reset">🧹 Löschen</button>'
          + '<button class="btn' + (revealed ? " sel" : "") + '" data-act="reveal">' + (revealed ? "🙈 Lösung verstecken" : "💡 Lösung zeigen") + "</button>"
          + '<button class="btn green" data-act="printview">🖨️ Druckansicht</button>'
          + "</div>"
          + '<div class="card"><h2>Der Grundriss</h2>'
          + '<div class="chips">' + ROOMS.map((r, i) => '<span class="chip r' + i + '">' + r + "</span>").join("") + "</div>"
          + '<div class="boardwrap"><div class="board">' + boardCells + "</div></div>"
          + '<div class="legend">🪑 Stuhl · 🛋️ Sofa · Tisch und Regal als Zeichnung &nbsp;—&nbsp; '
          + "🦊 Mila · 🐻 Ben · 🐰 Sofia · 🐨 Tim · 🦉 Luis (sucht)</div>"
          + '<div class="rules"><ul>'
          + "<li>Jeder steht auf einem eigenen Feld – keine zwei in derselben Reihe oder Spalte.</li>"
          + "<li>Auf Stuhl und Sofa kann man sitzen. Auf Tisch und Regal steht niemand.</li>"
          + "<li>„Neben“ heißt: direkt daneben und im selben Raum (nicht schräg, nicht durch eine Wand).</li>"
          + "<li>Luis war beim Suchen allein mit genau einem Kind im Raum – dieses Kind findet er als Erstes.</li>"
          + "</ul></div></div>"
          + '<div class="card"><h2>Hinweiskarten</h2>'
          + '<div class="cluegrid">' + clueCards + "</div>"
          + '<div class="tip"><b>Tipp:</b> Fang mit den Hinweisen an, die ganze Räume streichen („ist nicht in der Küche“). Weißt du, wo jemand sicher ist, sind seine Reihe und seine Spalte für alle anderen tabu.</div>'
          + "</div>"
          + '<div class="card"><h2>Notizzettel</h2>'
          + '<p class="note">Feld antippen zum Durchschalten: leer → ❌ (ausgeschlossen) → ✅ (sicher) → leer.</p>'
          + '<div class="pads">' + pads + "</div>"
          + '<div style="margin-top:14px;"><button class="btn green" data-act="checkMarks">Sichere Felder prüfen</button></div>'
          + "</div>"
          + '<div class="card"><h2>Wen findet Luis als Erstes?</h2>'
          + '<div class="kids">' + kidsBtn + "</div>"
          + '<div style="margin-top:14px;"><button class="btn primary" data-act="checkAnswer">Antwort prüfen</button></div>'
          + (feedback ? '<div class="feedback ' + (feedback.ok ? "ok" : "bad") + '">' + feedback.text
            + (revealed
              ? '<div style="margin-top:8px;color:#475569;">Lösung: <b>' + KIDS[puzzle.foundFirst] + "</b> ist als einzige Person mit Luis " + IN_ROOM[puzzle.rooms[puzzle.positions[SEEKER_IDX]]]
                + ". Vor den Hinweisen waren " + puzzle.baseCount.toLocaleString("de-DE") + " Aufstellungen möglich – Hinweis für Hinweis blieb übrig: " + puzzle.path.join(" → ") + ".</div>"
              : "")
            + "</div>" : "")
          + "</div>"
          + '<footer>Jeder Fall wird auf dem Gerät frisch erzeugt und auf genau eine Lösung geprüft.</footer>';
      }

      // ---------------- Druckansicht ----------------
      function boardTable(solution) {
        const thick = "2.5px solid #111", thin = "1px solid #999";
        const L = ["S", "W", "K"];
        let html = '<table class="ptable"><tr><td class="pnum"></td>';
        for (let i = 0; i < N; i++) html += '<td class="pnum">' + (i + 1) + "</td>";
        html += "</tr>";
        for (let r = 0; r < N; r++) {
          html += '<tr><td class="pnum">' + (r + 1) + "</td>";
          for (let c = 0; c < N; c++) {
            const x = r * N + c, room = puzzle.rooms[x];
            const bt = r === 0 || puzzle.rooms[(r - 1) * N + c] !== room ? thick : thin;
            const bb = r === N - 1 || puzzle.rooms[(r + 1) * N + c] !== room ? thick : thin;
            const bl = c === 0 || puzzle.rooms[r * N + c - 1] !== room ? thick : thin;
            const br = c === N - 1 || puzzle.rooms[r * N + c + 1] !== room ? thick : thin;
            let inner = "";
            const it = itemAt(x);
            const p = solution ? personAt(x) : null;
            if (p !== null) inner = '<div class="pperson">' + nameOf(p) + "</div>";
            if (it) inner += itemHTML(it.kind, p !== null ? 18 : 22);
            html += '<td class="r' + room + '" style="border-top:' + bt + ";border-bottom:" + bb + ";border-left:" + bl + ";border-right:" + br + '">'
              + '<span class="prl">' + L[room] + "</span>" + inner + "</td>";
          }
          html += "</tr>";
        }
        return html + "</table>";
      }

      function buildPrintSheet() {
        const seekerCard = clueCardHTML(
          "Luis zählt bis hundert und sucht dann. Er war allein mit genau einem Kind im Raum.",
          SEEKER_IDX, true
        );
        let cards = seekerCard;
        puzzle.clueCards.forEach((c) => { cards += clueCardHTML(c.t, c.p, true); });

        const positions = Array.from({ length: N }, (_, p) =>
          "<li><b>" + nameOf(p) + "</b>" + (p === SEEKER_IDX ? " (sucht)" : "") + ": " + posLine(p) + "</li>"
        ).join("");

        const swatches = ROOMS.map((r, i) =>
          '<li><span class="swatch" style="background:' + ROOM_COLOR[i] + '"></span>' + r + "</li>"
        ).join("");

        sheetEl.innerHTML =
          '<div class="printbar noprint">'
          + '<div class="flexline" style="display:flex;gap:8px;flex-wrap:wrap;">'
          + '<button class="btn" data-act="backtoapp">← Zurück zum Rätsel</button>'
          + '<button class="btn primary" data-act="doprint">🖨️ Jetzt drucken</button>'
          + "</div>"
          + '<div id="printhint">Kein Druck-Fenster erschienen? Diese Vorschau läuft eventuell eingebettet, '
          + "und manche Browser sperren dort den Druck-Dialog. Öffne die Datei direkt im Browser "
          + "(oder füge sie über „Zum Home-Bildschirm“ als App hinzu) – dort funktioniert Drucken immer.</div>"
          + '<div style="font-size:13px;color:#64748b;margin-top:6px;">Vorschau: Seite 1 = Rätsel, Seite 2 = Lösung</div>'
          + "</div>"
          + '<div class="sheet">'
          + "<h1>🙈 Verstecken! – Logikrätsel</h1>"
          + '<p class="psub">Fall Nr. ' + caseNo() + " · Luis zählt bis hundert und sucht. Mila, Ben, Sofia und Tim verstecken sich im Haus.<br><b>Frage: Wen findet Luis als Erstes?</b></p>"
          + '<div class="pcols"><div>'
          + "<h2>Regeln</h2>"
          + '<ol class="prules"><li>Jeder steht auf einem eigenen Feld – keine zwei in derselben Reihe oder Spalte.</li>'
          + "<li>Auf Stuhl und Sofa kann man sitzen. Auf Tisch und Regal steht niemand.</li>"
          + "<li>„Neben“ heißt: direkt daneben und im selben Raum (nicht schräg, nicht durch eine Wand).</li>"
          + "<li>Luis war beim Suchen allein mit genau einem Kind im Raum – dieses Kind findet er als Erstes.</li></ol>"
          + "<h2>Räume</h2>"
          + '<ul class="prooms">' + swatches + "</ul>"
          + '<p class="phint">Tipp: Streiche zuerst ganze Räume. Steht jemand sicher fest, sind seine Reihe und seine Spalte für alle anderen tabu.</p>'
          + "</div><div><h2>Grundriss</h2>" + boardTable(false) + "</div></div>"
          + "<h2>Hinweiskarten</h2>"
          + '<div class="pcards">' + cards + "</div>"
          + '<div class="panswer">Wen findet Luis als Erstes? &nbsp; ☐ Mila &nbsp; ☐ Ben &nbsp; ☐ Sofia &nbsp; ☐ Tim</div>'
          + "</div>"
          + '<div class="sheet">'
          + "<h1>Lösung · Fall Nr. " + caseNo() + "</h1>"
          + '<p class="psub">Bitte erst umblättern, wenn gerätselt wurde!</p>'
          + '<div class="pcols"><div><h2>Aufstellung</h2>' + boardTable(true) + "</div><div>"
          + '<h2>Positionen</h2><ul class="ppos">' + positions + "</ul>"
          + '<div class="psol"><b>Luis findet zuerst: ' + KIDS[puzzle.foundFirst] + ".</b><br>"
          + KIDS[puzzle.foundFirst] + " ist als einzige Person zusammen mit Luis " + IN_ROOM[puzzle.rooms[puzzle.positions[SEEKER_IDX]]] + ".</div>"
          + '<p class="phint">Vor den Hinweisen waren ' + puzzle.baseCount.toLocaleString("de-DE")
          + " Aufstellungen möglich – Hinweis für Hinweis blieb übrig: " + puzzle.path.join(" → ") + ".</p>"
          + "</div></div>"
          + "</div>";
      }

      function setPrintMode(on) {
        printMode = on;
        document.body.classList.toggle("printmode", on);
        window.scrollTo(0, 0);
        if (on) buildPrintSheet();
      }

      function doPrint() {
        let started = false;
        const mark = () => { started = true; };
        window.addEventListener("beforeprint", mark);
        window.addEventListener("afterprint", mark);
        try { window.print(); } catch (e) { /* Drucken blockiert */ }
        window.setTimeout(() => {
          window.removeEventListener("beforeprint", mark);
          window.removeEventListener("afterprint", mark);
          if (!started) {
            const h = document.getElementById("printhint");
            if (h) h.style.display = "block";
          }
        }, 900);
      }

      // ---------------- Aktionen ----------------
      function newGame() {
        seed = Math.floor(Math.random() * 2147483000) + 1;
        puzzle = generatePuzzle(seed);
        marks = Array.from({ length: N }, () => new Array(N * N).fill(0));
        answer = null;
        revealed = false;
        feedback = null;
        if (printMode) setPrintMode(false);
        renderApp();
      }

      function addSolved() {
        solvedCount += 1;
        try { localStorage.setItem("vssolved", String(solvedCount)); } catch (e) {}
      }

      function checkAnswer() {
        if (answer === null) {
          feedback = { ok: false, text: "Wähle erst ein Kind aus." };
        } else if (answer === puzzle.foundFirst) {
          if (!revealed) addSolved();
          revealed = true;
          feedback = { ok: true, text: "Richtig! " + KIDS[answer] + " wird als Erstes gefunden. 🎉" };
        } else {
          feedback = { ok: false, text: "Noch nicht richtig – streich noch ein paar Felder und probiere es erneut." };
        }
        renderApp();
      }

      function checkMarks() {
        const greens = [];
        const rowsUsed = new Set(), colsUsed = new Set();
        let conflict = false;
        for (let p = 0; p < N; p++) {
          const cells = [];
          for (let x = 0; x < N * N; x++) if (marks[p][x] === 2) cells.push(x);
          if (cells.length > 1) conflict = true;
          for (const x of cells) {
            if (greens.includes(x)) conflict = true;
            const r = Math.floor(x / N), c = x % N;
            if (rowsUsed.has(r) || colsUsed.has(c)) conflict = true;
            rowsUsed.add(r); colsUsed.add(c);
            greens.push(x);
            if (puzzle.positions[p] !== x) conflict = true;
          }
        }
        if (conflict) {
          feedback = { ok: false, text: "Die sicheren Felder widersprechen sich noch (doppelte Reihe, Spalte oder Feld – oder ein Feld stimmt nicht)." };
        } else if (greens.length === 0) {
          feedback = { ok: false, text: "Markiere erst ein paar Felder als sicher (✅)." };
        } else if (greens.length === N) {
          if (!revealed) addSolved();
          revealed = true;
          feedback = { ok: true, text: "Perfekt! Alle fünf Positionen stimmen. 🎉" };
        } else {
          feedback = { ok: true, text: "Alle " + greens.length + " sicheren Felder stimmen bisher!" };
        }
        renderApp();
      }

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const act = el.getAttribute("data-act");
        if (act === "new") newGame();
        else if (act === "reset") {
          marks = Array.from({ length: N }, () => new Array(N * N).fill(0));
          feedback = null;
          renderApp();
        } else if (act === "reveal") {
          revealed = !revealed;
          feedback = null;
          renderApp();
        } else if (act === "printview") {
          setPrintMode(true);
        } else if (act === "backtoapp") {
          setPrintMode(false);
        } else if (act === "doprint") {
          doPrint();
        } else if (act === "hideInstall") {
          const box = el.closest(".install");
          if (box) box.remove();
        } else if (act === "pad") {
          if (revealed) return;
          const p = +el.getAttribute("data-p"), x = +el.getAttribute("data-x");
          marks[p][x] = (marks[p][x] + 1) % 3;
          renderApp();
        } else if (act === "kid") {
          answer = +el.getAttribute("data-k");
          renderApp();
        } else if (act === "checkAnswer") checkAnswer();
        else if (act === "checkMarks") checkMarks();
      });

      renderApp();
    </script>
  </body>
</html>
